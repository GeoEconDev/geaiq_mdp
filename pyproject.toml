[project]
name = "geoecon_metadata"
version = "0.0.1"
authors = [
  { name="Cristian S. Rocha", email="csrocha@gmail.com" },
]
description = "Metadata loader scripts for GeoEcon"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ruamel.yaml==0.18.6", 
    "ruamel.yaml.clib==0.2.8",
    "pyyaml",
    "GitPython",
    "click",
    "pydantic",
    "pydantic_yaml",
    "python-slugify",
    "geopandas",
    "pandas-gbq",
    "google-api-python-client",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "gspread",
    "tabulate",
    "markdown",
    "chardet",
    "emoji",
    "python-markdown-math",
    "matplotlib==3.10.1"
]

[tool.setuptools.packages.find]
where = ["src/"]
exclude = ["tests*", "sql*"]

[project.scripts]
md-check-all = "geoecon_metadata.check:check_all"
md-check-files = "geoecon_metadata.check:check_files"
md-check-commit = "geoecon_metadata.check:check_commit"
giqmd = "geoecon_metadata.giqmd:cli"

[project.urls]
Homepage = "https://github.com/GeoEconDev/metadata"
Issues = "https://github.com/GeoEconDev/metadata/issues"
