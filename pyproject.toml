[project]
name = "geaiq_mdp"
version = "0.1.0a35"
authors = [
  { name="Cristian S. Rocha", email="csrocha@gmail.com" },
]
description = "Metadata loader scripts for GeoEcon"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "ruamel.yaml==0.18.6",
    "ruamel.yaml.clib==0.2.8",
    "pyyaml",
    "GitPython",
    "click",
    "pydantic",
    "pydantic_yaml",
    "python-slugify",
    "tabulate",
    "markdown",
    "chardet",
    "emoji",
    "python-markdown-math",
    "matplotlib==3.10.1"
]

[project.optional-dependencies]
gcp = [
    "geopandas",
    "pandas-gbq",
    "google-api-python-client",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "google-auth",
    "gspread",
]
airflow = [
    "apache-airflow-providers-google",
    "apache-airflow-providers-postgres",
]
test = [
    "pytest",
    "pandas",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src/"]
exclude = ["tests*", "sql*"]

# El JS del formulario del menú se embebe en el reporte y se lee del paquete en
# runtime (`report.py::_read_menu_script`), así que TIENE que viajar en el wheel:
# el Dockerfile hace `pip install .` y sin esto setuptools sólo copia los .py.
[tool.setuptools.package-data]
geaiq_mdp = ["statics/statics/*.js", "statics/statics/*.css"]

[project.scripts]
md-check-all = "geaiq_mdp.check:check_all"
md-check-files = "geaiq_mdp.check:check_files"
md-check-commit = "geaiq_mdp.check:check_commit"
giqmd = "geaiq_mdp.giqmd:cli"

[project.urls]
Homepage = "https://github.com/GeoEconDev/metadata"
Issues = "https://github.com/GeoEconDev/metadata/issues"
